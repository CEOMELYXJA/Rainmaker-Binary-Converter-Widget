; Convertisseur EXPLIQUE : decimal -> binaire + octal (1 a 300). ASCII pur.

[Rainmeter]
Update=1000
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14

[Metadata]
Name=Convertisseur Explique 300
Author=poiru (base) / adapte
Information=Binaire et octal de 1 a 300 avec petite explication.
License=Creative Commons BY-NC-SA 3.0
Version=3.0.0

[Variables]
fontName=Trebuchet MS
monoFont=Consolas
textSize=8
colorBar=235,60,60,255
colorText=255,255,255,205
colorYellow=255,210,60,255
Nombre=42

; ---------------- MEASURES ----------------

[mN]
Measure=Calc
Formula=Clamp(Trunc(#Nombre#),1,300)
DynamicVariables=1

[mB8]
Measure=Calc
Formula=Trunc(mN/256)%2

[mB7]
Measure=Calc
Formula=Trunc(mN/128)%2

[mB6]
Measure=Calc
Formula=Trunc(mN/64)%2

[mB5]
Measure=Calc
Formula=Trunc(mN/32)%2

[mB4]
Measure=Calc
Formula=Trunc(mN/16)%2

[mB3]
Measure=Calc
Formula=Trunc(mN/8)%2

[mB2]
Measure=Calc
Formula=Trunc(mN/4)%2

[mB1]
Measure=Calc
Formula=Trunc(mN/2)%2

[mB0]
Measure=Calc
Formula=mN%2

; Voyants : # = allume, . = eteint (alignes sous le dernier chiffre de chaque poids)
[mL8]
Measure=Calc
Formula=Trunc(mN/256)%2
Substitute="1":"  #","0":"  ."

[mL7]
Measure=Calc
Formula=Trunc(mN/128)%2
Substitute="1":"   #","0":"   ."

[mL6]
Measure=Calc
Formula=Trunc(mN/64)%2
Substitute="1":"   #","0":"   ."

[mL5]
Measure=Calc
Formula=Trunc(mN/32)%2
Substitute="1":"   #","0":"   ."

[mL4]
Measure=Calc
Formula=Trunc(mN/16)%2
Substitute="1":"   #","0":"   ."

[mL3]
Measure=Calc
Formula=Trunc(mN/8)%2
Substitute="1":"   #","0":"   ."

[mL2]
Measure=Calc
Formula=Trunc(mN/4)%2
Substitute="1":"   #","0":"   ."

[mL1]
Measure=Calc
Formula=Trunc(mN/2)%2
Substitute="1":"   #","0":"   ."

[mL0]
Measure=Calc
Formula=mN%2
Substitute="1":"   #","0":"   ."

[mO2]
Measure=Calc
Formula=Trunc(mN/64)%8

[mO1]
Measure=Calc
Formula=Trunc(mN/8)%8

[mO0]
Measure=Calc
Formula=mN%8

[mInput]
Measure=Plugin
Plugin=InputText
UpdateDivider=-1
X=55
Y=34
W=90
H=28
StringAlign=Center
FontFace=#monoFont#
FontSize=16
FontColor=255,210,60,255
SolidColor=20,20,20,255
InputNumber=1
InputLimit=3
FocusDismiss=1
DefaultValue=#Nombre#
Command1=[!SetVariable Nombre "$UserInput$"][!Update]

; ---------------- STYLES ----------------

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleCenterText]
StringAlign=Center
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=7
AntiAlias=1
ClipString=1

[styleRightMono]
StringAlign=Right
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorYellow#
FontFace=#monoFont#
FontSize=12
AntiAlias=1
ClipString=1

[styleSeperator]
SolidColor=255,255,255,15

[styleButton]
StringAlign=CenterCenter
StringStyle=Bold
FontColor=#colorYellow#
FontFace=#monoFont#
FontSize=14
SolidColor=255,255,255,15
AntiAlias=1
W=26
H=26

; ---------------- METERS ----------------

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=10
W=190
H=18
FontColor=#colorYellow#
Text=* Convertisseur *

[meterSep1]
Meter=Image
MeterStyle=styleSeperator
X=10
Y=30
W=190
H=1

[meterMinus]
Meter=String
MeterStyle=styleButton
X=23
Y=47
Text=-
LeftMouseUpAction=[!SetVariable Nombre "(Clamp(#Nombre#-1,1,300))"][!Update]

[meterNumber]
Meter=String
MeterStyle=styleRightMono
MeasureName=mN
X=100
Y=34
W=90
H=28
FontSize=20
StringAlign=Center
NumOfDecimals=0
Text=%1
LeftMouseUpAction=[!CommandMeasure mInput "ExecuteBatch 1"]
ToolTipText=Clique pour taper un nombre de 1 a 300

[meterPlus]
Meter=String
MeterStyle=styleButton
X=177
Y=47
Text=+
LeftMouseUpAction=[!SetVariable Nombre "(Clamp(#Nombre#+1,1,300))"][!Update]

[meterSep2]
Meter=Image
MeterStyle=styleSeperator
X=10
Y=68
W=190
H=1

; --- Binaire ---
[meterBinLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=76
W=70
H=14
Text=BINAIRE

[meterBinValue]
Meter=String
MeterStyle=styleRightMono
MeasureName=mB8
MeasureName2=mB7
MeasureName3=mB6
MeasureName4=mB5
MeasureName5=mB4
MeasureName6=mB3
MeasureName7=mB2
MeasureName8=mB1
MeasureName9=mB0
X=200
Y=73
W=130
H=18
NumOfDecimals=0
Text=%1%2%3%4%5%6%7%8%9

[meterWeights]
Meter=String
MeterStyle=styleCenterText
X=100
Y=96
W=190
H=12
FontFace=#monoFont#
Text="256 128  64  32  16   8   4   2   1"

[meterLamps]
Meter=String
MeterStyle=styleCenterText
MeasureName=mL8
MeasureName2=mL7
MeasureName3=mL6
MeasureName4=mL5
MeasureName5=mL4
MeasureName6=mL3
MeasureName7=mL2
MeasureName8=mL1
MeasureName9=mL0
X=100
Y=109
W=190
H=14
FontFace=#monoFont#
FontColor=#colorYellow#
Text=%1%2%3%4%5%6%7%8%9

[meterExplain1]
Meter=String
MeterStyle=styleCenterText
X=100
Y=127
W=190
H=11
Text=# = case ajoutee, . = ignoree

[meterExplain2]
Meter=String
MeterStyle=styleCenterText
X=100
Y=138
W=190
H=11
Text=Somme des # = le nombre

[meterSep3]
Meter=Image
MeterStyle=styleSeperator
X=10
Y=156
W=190
H=1

; --- Octal ---
[meterOctLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=164
W=70
H=14
Text=OCTAL

[meterOctValue]
Meter=String
MeterStyle=styleRightMono
MeasureName=mO2
MeasureName2=mO1
MeasureName3=mO0
X=200
Y=161
W=130
H=18
NumOfDecimals=0
Text=%1%2%3

[meterOctExplain]
Meter=String
MeterStyle=styleCenterText
X=100
Y=182
W=190
H=11
Text=Octal = bits par groupes de 3
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur binaire et octal</title>
<style>
  :root {
    --fond: #0f0f10;
    --panneau: #19191b;
    --texte: rgba(255,255,255,.80);
    --rouge: #eb3c3c;
    --jaune: #ffd23c;
    --trait: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--fond);
    color: var(--texte);
    font-family: "Trebuchet MS", Tahoma, sans-serif;
  }
  .widget {
    width: 100%;
    max-width: 360px;
    background: var(--panneau);
    border-radius: 4px;
    padding: 14px 18px 18px;
  }
  .mono { font-family: Consolas, "Courier New", monospace; }
  h1 {
    margin: 0 0 10px;
    text-align: center;
    font-size: 16px;
    letter-spacing: .08em;
    color: var(--jaune);
    text-transform: uppercase;
  }
  hr { border: 0; height: 1px; background: var(--trait); margin: 10px 0; }

  .saisie { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .saisie button {
    width: 40px; height: 40px;
    border: 0; border-radius: 3px;
    background: rgba(255,255,255,.07);
    color: var(--jaune);
    font: bold 20px Consolas, monospace;
    cursor: pointer;
  }
  .saisie button:hover { background: rgba(255,255,255,.14); }
  .saisie input {
    width: 100%; max-width: 130px;
    text-align: center;
    background: transparent;
    border: 0; border-bottom: 1px solid var(--trait);
    color: var(--jaune);
    font: bold 34px Consolas, monospace;
    -moz-appearance: textfield;
  }
  .saisie input::-webkit-outer-spin-button,
  .saisie input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--jaune); outline-offset: 2px; }

  .jauge { height: 2px; background: rgba(255,255,255,.07); margin-top: 10px; }
  .jauge i { display: block; height: 100%; background: var(--rouge); width: 0; }

  .ligne { display: flex; justify-content: space-between; align-items: baseline; font-weight: bold; font-size: 13px; }
  .valeur { color: var(--jaune); font-size: 20px; letter-spacing: .06em; }

  .grille {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    text-align: center;
    margin-top: 6px;
    font-size: 11px;
  }
  .grille .voyant { color: var(--jaune); font-weight: bold; font-size: 14px; }
  .note { margin: 4px 0 0; text-align: center; font-size: 11px; font-weight: bold; }
</style>
</head>
<body>
<main class="widget">
  <h1>* Convertisseur *</h1>
  <hr>

  <div class="saisie">
    <button id="moins" aria-label="Moins 1">-</button>
    <input id="nombre" class="mono" type="number" min="1" max="300" value="42" aria-label="Nombre de 1 à 300">
    <button id="plus" aria-label="Plus 1">+</button>
  </div>
  <div class="jauge"><i id="jauge"></i></div>
  <hr>

  <div class="ligne"><span>BINAIRE</span><span class="valeur mono" id="bin"></span></div>
  <div class="grille mono" id="poids"></div>
  <div class="grille mono" id="voyants"></div>
  <p class="note">Les # sont les cases ajoutées, les . sont ignorées</p>
  <p class="note">La somme des # donne le nombre</p>
  <hr>

  <div class="ligne"><span>OCTAL</span><span class="valeur mono" id="oct"></span></div>
  <p class="note">Octal = les bits par groupes de 3</p>
</main>

<script>
  const MIN = 1, MAX = 300;
  const POIDS = [256, 128, 64, 32, 16, 8, 4, 2, 1];
  const champ = document.getElementById("nombre");

  document.getElementById("poids").innerHTML =
    POIDS.map(p => "<span>" + p + "</span>").join("");

  function limiter(v) {
    v = Math.trunc(Number(v));
    if (!Number.isFinite(v)) v = MIN;
    return Math.min(MAX, Math.max(MIN, v));
  }

  function afficher(n) {
    const bits = n.toString(2).padStart(9, "0");
    document.getElementById("bin").textContent = bits;
    document.getElementById("oct").textContent = n.toString(8).padStart(3, "0");
    document.getElementById("voyants").innerHTML =
      [...bits].map(b => '<span class="voyant">' + (b === "1" ? "#" : ".") + "</span>").join("");
    document.getElementById("jauge").style.width = (n / MAX * 100) + "%";
  }

  function mettreAJour(valeur, corriger) {
    const n = limiter(valeur);
    if (corriger) champ.value = n;
    afficher(n);
  }

  champ.addEventListener("input", () => mettreAJour(champ.value, false));
  champ.addEventListener("change", () => mettreAJour(champ.value, true));
  document.getElementById("moins").addEventListener("click", () => mettreAJour(limiter(champ.value) - 1, true));
  document.getElementById("plus").addEventListener("click", () => mettreAJour(limiter(champ.value) + 1, true));

  mettreAJour(champ.value, true);
</script>
</body>
</html>
